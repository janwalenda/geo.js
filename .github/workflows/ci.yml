name: CI

on:
  push:
    branches:
      [
        main,
        develop,
        'feature/**',
        'bugfix/**',
        'release/**',
        'hotfix/**',
        'support/**',
      ]
  pull_request:
    branches: [main, develop]

# Least privilege: the workflow only reads the repository. It also runs for pull
# requests from forks, so it must never get write access or secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is end-of-life and cannot run the jsdom test environment.
        node: [22, 24]
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
