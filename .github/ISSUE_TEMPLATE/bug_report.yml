name: Bug report
description: Something renders wrong, throws, or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems** must not be reported here – see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal example
      description: The smallest code that shows the problem.
      render: ts
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      multiple: true
      options: [Canvas 2D, SVG, toSVGString, not renderer-specific]
  - type: input
    id: version
    attributes:
      label: geo.js version
      placeholder: e.g. 0.1.2
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / Node version
